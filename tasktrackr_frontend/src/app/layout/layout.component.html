<header class="hdr">
  <button class="hdr__menu btn btn--ghost" (click)="toggleSidebar()" aria-label="Toggle Menu">
    ☰
  </button>
  <div class="hdr__title">TaskTrackr</div>
  <div class="spacer"></div>
  <a class="hdr__link" href="https://angular.dev" target="_blank" rel="noreferrer">Docs</a>
</header>

<div class="shell">
  <aside class="sidebar" [class.sidebar--closed]="!isSidebarOpen()">
    <div class="sidebar__brand">
      <span class="dot" style="background: var(--color-primary)"></span>
      <span class="dot" style="background: var(--color-accent)"></span>
      <span class="dot" style="background: var(--color-secondary)"></span>
      <strong>Overview</strong>
    </div>
    <nav class="sidebar__nav">
      <a class="nav__item nav__item--active" href="/">Tasks</a>
      <!-- Future: Projects, Settings -->
    </nav>
    <div class="sidebar__footer">
      <small>v0.1.0</small>
    </div>
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>
